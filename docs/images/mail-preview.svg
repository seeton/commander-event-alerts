<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title description">
  <title id="title">Commander Event Alertsの通知メールサンプル</title>
  <desc id="description">開催予定の大規模統率者イベントをカード形式で表示したメールのサンプル</desc>
  <rect width="1000" height="900" fill="#f4f5f7"/>
  <rect x="110" y="55" width="780" height="790" rx="20" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/>
  <rect x="110" y="55" width="780" height="72" rx="20" fill="#20242c"/>
  <rect x="110" y="105" width="780" height="22" fill="#20242c"/>
  <circle cx="150" cy="91" r="8" fill="#ff6b6b"/>
  <circle cx="177" cy="91" r="8" fill="#ffd43b"/>
  <circle cx="204" cy="91" r="8" fill="#69db7c"/>
  <text x="500" y="99" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif" font-size="20" fill="#ffffff">通知メールのサンプル</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif" fill="#20242c">
    <text x="160" y="184" font-size="30" font-weight="700">今後の大規模統率者イベント</text>
    <text x="160" y="225" font-size="18" fill="#5b6472">開催前の対象イベントを月初に毎回お知らせします。</text>

    <rect x="155" y="268" width="690" height="220" rx="12" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/>
    <text x="185" y="321" font-size="24" font-weight="700">コマンドフェスト20XX 東京</text>
    <text x="185" y="365" font-size="18">開催日: 20XX年10月10日 09時</text>
    <text x="185" y="399" font-size="18">会場: 東京</text>
    <text x="185" y="433" font-size="18">情報元: イベント公式ページ</text>
    <text x="185" y="468" font-size="18" fill="#0969da" text-decoration="underline">詳細を見る</text>

    <rect x="155" y="518" width="690" height="220" rx="12" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/>
    <text x="185" y="571" font-size="24" font-weight="700">プレイヤーズコンベンション：コマンドゾーン</text>
    <text x="185" y="615" font-size="18">開催日: 20XX年11月2日</text>
    <text x="185" y="649" font-size="18">会場: 横浜</text>
    <text x="185" y="683" font-size="18">情報元: プレイヤーズコンベンション公式</text>
    <text x="185" y="718" font-size="18" fill="#0969da" text-decoration="underline">詳細を見る</text>

    <text x="160" y="793" font-size="15" fill="#7a828e">commander-event-alerts / GitHub Actions</text>
  </g>
  <rect x="753" y="147" width="92" height="34" rx="17" fill="#e7f5ff"/>
  <text x="799" y="170" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1971c2">SAMPLE</text>
</svg>
